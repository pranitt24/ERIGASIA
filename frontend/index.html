<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- To go live, set content to the URL of your api.http.js. Leave it empty to run on the built-in mock API. -->
<meta name="ergasia-backend" content="">
<title>Ergasia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F8FE; --powder:#DCEBFA; --powder2:#C4DDF5; --sky:#7DBEF2; --skyd:#3F95E4;
  --blue:#1D68CC; --ink:#0A2342; --ink2:#4A6584; --surface:#FFFFFF; --on-blue:#FFFFFF;
  --ok:#2A9C78; --okbg:#D8F2E9; --warn:#B7791F; --warnbg:#FCEFD3; --bad:#C94B4B; --badbg:#FBE0E0;
  --shadow:0 28px 60px -34px rgba(29,104,204,.45);
  --display:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1A2F; --powder:#12294A; --powder2:#1F3E68; --sky:#5AA8F5; --skyd:#7DBEF2;
    --blue:#6DB1F7; --ink:#E9F3FE; --ink2:#9DB7D6; --surface:#102240; --on-blue:#07182E;
    --okbg:#12392F; --warnbg:#3C3014; --badbg:#3E1B1B; --shadow:0 28px 60px -34px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1A2F; --powder:#12294A; --powder2:#1F3E68; --sky:#5AA8F5; --skyd:#7DBEF2;
  --blue:#6DB1F7; --ink:#E9F3FE; --ink2:#9DB7D6; --surface:#102240; --on-blue:#07182E;
  --okbg:#12392F; --warnbg:#3C3014; --badbg:#3E1B1B; --shadow:0 28px 60px -34px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.02}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- word reveal ---------- */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.16em;margin-bottom:-.16em}
.wi{display:inline-block;transform:translateY(112%);transition:transform 1s var(--ease)}
.in .wi{transform:none}
.sw{opacity:.14;transition:opacity .15s linear}

/* ---------- header ---------- */
.topbar{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));z-index:50;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.topbar-in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:7px 8px 7px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:100%}
.logo{font:800 1.3rem var(--display);letter-spacing:-.04em;text-decoration:none;margin-right:10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--blue))}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-weight:700;font-size:.92rem;padding:9px 16px;border-radius:999px;white-space:nowrap;color:var(--ink2);transition:background .3s,color .3s}
.nav a:hover{color:var(--ink);background:var(--powder)}
.nav a.on{background:var(--ink);color:var(--paper)}
.who{display:flex;align-items:center;gap:8px;margin-left:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--powder2);display:grid;place-items:center;font:800 .9rem var(--display);flex:none}
.out{font-weight:700;font-size:.85rem;color:var(--ink2);padding:8px 12px;border-radius:999px}
.out:hover{background:var(--powder)}
@media (max-width:760px){.out{display:none}.logo span{display:none}}

/* ---------- layout ---------- */
main{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:128px 24px 96px}
.page{animation:pageIn .6s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h1{font-size:clamp(2.5rem,6vw,4.8rem);margin-bottom:12px}
.h2{font-size:clamp(1.6rem,3vw,2.3rem);margin-bottom:6px}
.h3{font-size:1.3rem}
.sub{color:var(--ink2);font-size:1.08rem;max-width:60ch}
.head{margin-bottom:40px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:32px;padding:30px;box-shadow:var(--shadow)}
.tint{background:var(--powder);box-shadow:none}
.deep{background:var(--ink);color:var(--paper);box-shadow:none}
.deep .sub,.deep .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.sec{margin-top:56px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--on-blue);font-weight:700;padding:13px 24px;border-radius:999px;transition:transform .3s var(--ease),box-shadow .3s,background .3s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px var(--blue)}
.btn:active{transform:translateY(0)}
.btn.soft{background:var(--powder);color:var(--ink)}
.btn.soft:hover{background:var(--powder2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--powder2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--sky);background:transparent}
.btn.sm{padding:8px 16px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.load::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
label.f{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--powder);border-radius:16px;padding:12px 16px;transition:border-color .25s,background .25s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);background:var(--surface)}
textarea{min-height:130px;resize:vertical;line-height:1.55}
.seg{display:inline-flex;background:var(--powder);border-radius:999px;padding:4px}
.seg button{padding:9px 22px;border-radius:999px;font-weight:700;color:var(--ink2);transition:all .3s var(--ease)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 6px 14px -8px rgba(29,104,204,.6)}
.chip{display:inline-flex;align-items:center;font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:999px;background:var(--powder);color:var(--ink);white-space:nowrap}
.chip.co{background:var(--ink);color:var(--paper)}
.chip.marks{background:transparent;box-shadow:inset 0 0 0 2px var(--powder2)}
.b0{background:#E6F1FC}.b1{background:#CFE4F8}.b2{background:#B2D6F4}.b3{background:#8FC4EE}.b4{background:#6BB0E8}.b5{background:#4C9BE0}
:root[data-theme="dark"] .b0,:root[data-theme="dark"] .b1,:root[data-theme="dark"] .b2,:root[data-theme="dark"] .b3,:root[data-theme="dark"] .b4,:root[data-theme="dark"] .b5{color:#07182E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b0,:root:not([data-theme="light"]) .b1,:root:not([data-theme="light"]) .b2,:root:not([data-theme="light"]) .b3,:root:not([data-theme="light"]) .b4,:root:not([data-theme="light"]) .b5{color:#07182E}}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.8rem;padding:5px 13px;border-radius:999px;background:var(--powder);color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.s-teacher_confirmed,.s-released{background:var(--okbg);color:var(--ok)}
.s-regrade_requested{background:var(--warnbg);color:var(--warn)}
.s-submitted,.s-generating{background:var(--powder2);color:var(--blue)}
.s-submitted::before,.s-generating::before{animation:pulse 1.1s ease-in-out infinite}
.s-ai_graded,.s-in_review{background:var(--sky);color:#06203F}
@keyframes pulse{50%{opacity:.15;transform:scale(1.5)}}

/* ---------- lists ---------- */
.item{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:22px;background:var(--paper);text-decoration:none;transition:background .3s,transform .4s var(--ease)}
a.item:hover,button.item:hover{background:var(--powder);transform:translateX(4px)}
.item+.item{margin-top:10px}
.item .grow{flex:1;min-width:0}
.item b{font-family:var(--display);font-weight:800;font-size:1.12rem;letter-spacing:-.02em;display:block}
.bar{height:12px;border-radius:99px;background:var(--powder);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--blue));transition:width 1.3s var(--ease)}
.bar.low i{background:linear-gradient(90deg,#9CCBF3,var(--sky))}
.ring text{font:800 22px var(--display);fill:var(--ink)}
.ring .rv{transition:stroke-dashoffset 1.4s var(--ease)}
.big{font:800 clamp(3.4rem,8vw,6rem)/.9 var(--display);letter-spacing:-.05em}
.big small{font-size:.35em;letter-spacing:-.02em;color:var(--ink2)}
.q{padding:30px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}
.q+.q{margin-top:22px}
.q .qt{font:700 1.3rem/1.35 var(--display);letter-spacing:-.02em;margin:16px 0}
details.why{margin:0 0 16px;background:var(--powder);border-radius:18px;padding:12px 18px}
details.why summary{cursor:pointer;font-weight:700;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why p{margin-top:8px;color:var(--ink2)}
.drop{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 18px;border-radius:18px;border:2px dashed var(--powder2);cursor:pointer;color:var(--ink2);font-weight:700;transition:all .3s}
.drop:hover{border-color:var(--sky);background:var(--paper)}
.drop input{display:none}
.sticky-bar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--ink);color:var(--paper);padding:14px 14px 14px 28px;border-radius:999px;z-index:5;box-shadow:0 20px 40px -20px rgba(10,35,66,.7)}
.sticky-bar .btn{background:var(--sky);color:#06203F}
.skel{border-radius:28px;background:linear-gradient(100deg,var(--powder) 30%,var(--paper) 50%,var(--powder) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
.err{text-align:center;padding:48px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:13px 24px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .5s var(--ease);z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flow{display:flex;gap:0;flex-wrap:wrap}
.flow>div{flex:1;min-width:130px;padding:6px 20px 6px 0}
.flow b{font:800 3rem/1 var(--display);letter-spacing:-.05em;display:block}
.flow span{color:var(--ink2);font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{text-align:left;font-weight:700;color:var(--ink2);font-size:.85rem;padding:0 14px}
.tbl td{padding:14px;background:var(--paper)}
.tbl td:first-child{border-radius:16px 0 0 16px}.tbl td:last-child{border-radius:0 16px 16px 0}
.scroll-x{overflow-x:auto}
.heat{display:grid;gap:6px;min-width:520px}
.heat .hc{border-radius:14px;padding:14px 8px;text-align:center;font-weight:800;font-family:var(--display);transition:transform .3s var(--ease)}
.heat .hn{display:flex;align-items:center;padding:0 8px;font-weight:700;text-align:left;border-radius:14px}
.heat button.hn:hover,.heat button.hn.on{background:var(--powder)}
.heat .hh{font-weight:700;font-size:.85rem;color:var(--ink2);text-align:center;padding:4px}
.heat .hc:hover{transform:scale(1.06)}
.legend{height:10px;border-radius:99px;background:linear-gradient(90deg,rgba(29,104,204,.08),rgba(29,104,204,1));width:180px}
.rv-grid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
@media (max-width:900px){.rv-grid{grid-template-columns:1fr}}
.side{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.sel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;transition:background .25s}
.sel:hover{background:var(--powder)}
.sel.on{background:var(--ink);color:var(--paper)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--powder2);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.crit{display:grid;grid-template-columns:1fr 84px;gap:6px 16px;align-items:center;padding:14px 0;border-top:2px solid var(--powder)}
.crit input{padding:8px 12px;text-align:center;font-weight:700}
.crit .cm{grid-column:1/-1;color:var(--ink2);font-size:.9rem}
.answer{background:var(--paper);border-radius:20px;padding:16px 20px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:99px;background:var(--powder);font-weight:700;font-size:.88rem}
.tag button{width:22px;height:22px;border-radius:50%;background:var(--surface)}
.cob{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--paper);cursor:pointer;transition:background .25s;margin-top:8px}
.cob:hover{background:var(--powder)}
.cob input{margin-top:5px;accent-color:var(--blue);width:18px;height:18px}
.step{display:flex;gap:14px;align-items:center;padding:10px 0;color:var(--ink2);font-weight:700;transition:color .4s}
.step.on{color:var(--ink)}
.step i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--powder2);flex:none;transition:all .4s}
.step.on i{box-shadow:inset 0 0 0 3px var(--sky);animation:pulse 1.1s infinite}
.step.done i{background:var(--ok);box-shadow:none;animation:none}
.step.done{color:var(--ink)}
.dz-on{outline:3px dashed var(--sky);outline-offset:-8px}

/* ---------- landing ---------- */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;padding:130px 24px 80px}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.hero-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.hero-bg i:nth-child(1){width:46vw;height:46vw;background:var(--powder2);left:-10vw;top:-12vw}
.hero-bg i:nth-child(2){width:38vw;height:38vw;background:var(--sky);opacity:.35;right:-8vw;top:18vh}
.hero-bg i:nth-child(3){width:30vw;height:30vw;background:var(--powder);left:30vw;bottom:-14vw}
.hero-in{position:relative;max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:center}
@media (max-width:900px){.hero-in{grid-template-columns:1fr;gap:36px}}
.display{font-size:clamp(3.2rem,9.2vw,8.2rem);line-height:.9;letter-spacing:-.05em}
.lede{font-size:1.2rem;color:var(--ink2);margin-top:26px;max-width:46ch}
.story{height:260vh;position:relative}
.story-in{position:sticky;top:0;height:100vh;display:grid;place-items:center;padding:0 24px}
.scrub{font:800 clamp(1.9rem,4.4vw,3.8rem)/1.08 var(--display);letter-spacing:-.035em;max-width:1000px}
.trio{max-width:1180px;margin:0 auto;padding:40px 24px 120px}
.tr{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:56px 0;align-items:start}
.tr+.tr{border-top:3px solid var(--powder)}
.tr h2{font-size:clamp(2.2rem,5vw,4.2rem);line-height:.96}
.tr p{font-size:1.15rem;color:var(--ink2);padding-top:10px}
@media (max-width:800px){.tr{grid-template-columns:1fr;gap:16px;padding:40px 0}}
.endcta{background:var(--powder);padding:120px 24px;text-align:center}
.endcta h2{font-size:clamp(2.6rem,7vw,6rem);line-height:.92;letter-spacing:-.05em;max-width:14ch;margin:0 auto 32px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .wi{transform:none}.sw{opacity:1}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   ERGASIA: front end
   Everything below the "MOCK API" banner returns the response shapes the
   UI expects. To go live, set the <meta name="ergasia-backend"> content to
   the URL of a script that defines window.ERGASIA_API with the same methods.
   The UI code only ever talks to `api`.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pct=x=>Math.round(x*100);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return iso(x)};
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const daysLeft=d=>Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>{let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};

/* ============================ MOCK API ============================ */
const BLOOM=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
const levelRange=m=>m<.2?[BLOOM[0],BLOOM[0]]:m<.4?[BLOOM[0],BLOOM[1]]:m<.55?[BLOOM[1],BLOOM[2]]:m<.7?[BLOOM[2],BLOOM[3]]:m<.85?[BLOOM[3],BLOOM[4]]:[BLOOM[4],BLOOM[5]];
const COURSE={code:'PEIT21T',name:'Artificial Intelligence'};
const COS={CO1:'Model intelligent agents and solve problems with search',CO2:'Apply adversarial, local and planning methods',CO3:'Reason with logic, probability and learning theory'};
const PO_OF={CO1:['PO1','PO2'],CO2:['PO1','PO3'],CO3:['PO2','PO5']};
/* syllabus: [key, label, course outcome] */
const SYLLABUS=[
 ['peas','PEAS & Intelligent Agents','CO1'],['uninf','Uninformed Search (BFS & DFS)','CO1'],['astar','A* Search & Heuristics','CO1'],
 ['minimax','Minimax & Alpha-Beta Pruning','CO2'],['local','Hill Climbing & Genetic Algorithms','CO2'],
 ['logic','Propositional & First-Order Logic','CO3'],['unify','Unification & Resolution','CO3'],['bayes','Bayesian Belief Networks','CO3'],
 ['plan','State-Space & Hierarchical Planning','CO2'],['pac','PAC & Statistical Learning','CO3'],['ethics','Responsible AI, Fairness & Ethics','CO3']];
const TL={},TOPIC_CO={},CO_TOPICS={CO1:[],CO2:[],CO3:[]};
SYLLABUS.forEach(([k,l,c])=>{TL[k]=l;TOPIC_CO[k]=c;CO_TOPICS[c].push(k)});

function splitReveal(el){if(el.dataset.split)return;const words=el.textContent.trim().split(/\s+/);el.textContent='';
  words.forEach((w,i)=>{const o=document.createElement('span');o.className='w';const n=document.createElement('span');n.className='wi';n.textContent=w;n.style.transitionDelay=(i*55)+'ms';o.appendChild(n);el.appendChild(o);el.appendChild(document.createTextNode(' '))});el.dataset.split=1}

let io=null,scrubs=[],tick=false;
function onScroll(){if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;
  scrubs.forEach(({host,words})=>{const r=host.getBoundingClientRect();const p=clamp(-r.top/Math.max(1,r.height-innerHeight));const n=words.length;
    words.forEach((w,i)=>{const t=clamp((p*1.18*n-i)/3);w.style.opacity=(.14+.86*t).toFixed(3)})})})}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
function mountMotion(root){
  io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2,rootMargin:'0px 0px -6% 0px'});
  $$('[data-reveal]',root).forEach(el=>{splitReveal(el);io.observe(el)});
  $$('[data-scrub]',root).forEach(splitScrub);
  scrubs=$$('[data-scrubhost]',root).map(h=>({host:h,words:$$('.sw',h)}));onScroll();
  requestAnimationFrame(()=>setTimeout(()=>{
    $$('[data-w]',root).forEach(e=>e.style.width=e.dataset.w+'%');
    $$('.rv',root).forEach(e=>e.style.strokeDashoffset=e.dataset.off);
    $$('[data-count]',root).forEach(el=>{const to=+el.dataset.count,dec=+(el.dataset.dec||0),t0=performance.now();const f=t=>{const k=clamp((t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
  },80));

   <div class="tr"><h2 data-reveal>Grades arrive fast and stay yours to change.</h2><p>The AI scores against a rubric and writes feedback. Low-confidence grades and re-check requests rise to the top of your queue, where you can override anything.</p></div>

    ${prog.modules.map(m=>`<div><div class="row between small" style="margin-bottom:6px"><b>${esc(m.name)} <span class="chip" style="margin-left:6px">${m.co_id}</span></b><span class="muted">${pct(m.completed)}% done</span></div>${bar(m.completed,m.completed<.5)}</div>`).join('')}</div></div>
    <div class="panel deep stack"><h2 class="h3">Focus on next</h2><p class="sub">Your lowest outcome is <b>${weak.co_id}</b>: ${esc(weak.title)}, at ${pct(weak.mastery)}%. Questions on it will start at ${weak.bloom_level_range[0]}–${weak.bloom_level_range[1]} level.</p><a class="btn" style="background:var(--sky);color:#06203F" href="#/s/progress">See my progress</a></div></div></div>`};
}
async function sAssign(vid){
  const [{variant,assignment,submission},prog]=await Promise.all([api.variant(vid),api.progress()]);const done=!!submission;
  const why=q=>{const r=prog.cos.find(c=>c.co_id===q.co_id);return `This question targets ${q.co_id} (${esc(COS[q.co_id])}). Your mastery there is ${pct(r.mastery)}%, which places you at ${r.bloom_level_range[0]}–${r.bloom_level_range[1]} level, so it is set at ${q.bloom_level}. Everyone in the class covers the same topics for the same total marks.`};
  return {html:`<div class="wrap"><div class="head"><a class="muted small" href="#/s/dashboard">Back to dashboard</a><h1 class="h1" data-reveal style="margin-top:12px">${esc(assignment.title)}</h1>
   <p class="sub">${assignment.total} marks · Due ${fmtDate(assignment.due)} · ${esc(assignment.course)}</p></div>
   ${done?`<div class="panel tint row between" style="margin-bottom:22px"><span>You submitted this on ${fmtDate(submission.submitted_at)}.</span><a class="btn" href="#/s/grades/${submission.id}">View grade</a></div>`:''}
   <div id="qs">${variant.questions.map((q,i)=>`<section class="q"><div class="row">${chips(q)}</div><p class="qt">${i+1}. ${esc(q.text)}</p>
    <details class="why"><summary>Why this question?</summary><p>${why(q)}</p></details>
    <label class="f" for="a-${q.question_id}">Your answer</label><textarea id="a-${q.question_id}" data-q="${q.question_id}" ${done?'disabled':''} placeholder="Type your answer here">${done?esc(submission.answers?.find(a=>a.question_id===q.question_id)?.text||''):''}</textarea>
    ${done?'':`<label class="drop"><input type="file" data-f="${q.question_id}" accept=".pdf,image/*"><span>Attach a PDF or photo</span><em class="small" style="font-weight:500"></em></label>`}</section>`).join('')}</div>
   ${done?'':`<div class="sticky-bar"><span>Your answers stay private until you submit.</span><button class="btn" id="submitBtn">Submit assignment</button></div>`}</div>`,
  mount(){
    $$('input[type=file]').forEach(i=>i.onchange=()=>{i.parentElement.querySelector('em').textContent=i.files[0]?i.files[0].name:''});
    const b=$('#submitBtn');if(!b)return;
    b.onclick=async()=>{const answers=variant.questions.map(q=>({question_id:q.question_id,text:$(`[data-q="${q.question_id}"]`).value.trim()}));
      if(answers.some(a=>!a.text&&!$(`[data-f="${a.question_id}"]`).files[0])){toast('Answer every question or attach a file for it.');return}
      b.classList.add('load');b.disabled=true;
      try{const r=await api.submit({variant_id:vid,answers,files:$$('[data-f]').filter(i=>i.files[0]).map(i=>({question_id:i.dataset.f,name:i.files[0].name,file:i.files[0]}))});toast('Submitted. Grading has started.');location.hash='#/s/grades/'+r.submission_id}
      catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}};
  }};
}

async function sGrade(id){
  const d=await api.submission(id);const g=d.grade;
  const poll=!g&&d.submission.status==='submitted';
  const total=g?(g.teacher_override?g.teacher_override.total:g.total_score):0;
  return {html:`<div class="wrap"><div class="head"><a class="muted small" href="#/s/grades">All submissions</a><h1 class="h1" data-reveal style="margin-top:12px">${esc(d.assignment_title)}</h1><div class="row">${pill(d.submission.status)}<span class="muted">Submitted ${fmtDate(d.submission.submitted_at)}</span></div></div>
  ${poll?`<div class="panel tint stack" id="wait"><h2 class="h2">Grading in progress</h2><p class="sub">The AI is scoring each rubric criterion. This page updates by itself.</p><div class="skel" style="height:14px"></div><div class="skel" style="height:14px;width:70%"></div></div>`:`
  <div class="split"><div class="panel"><div class="row between"><div><p class="muted">Your score</p><div class="big"><span data-count="${total}" data-dec="${total%1?1:0}">0</span><small> / ${g.max_score}</small></div></div>${g.teacher_override?'<span class="pill s-teacher_confirmed">Adjusted by your teacher</span>':''}</div>
   <h2 class="h3" style="margin:34px 0 8px">Rubric breakdown</h2>${g.per_criterion.map(c=>`<div style="padding:12px 0;border-top:2px solid var(--powder)"><div class="row between small" style="margin-bottom:6px"><b>${esc(c.criterion)}</b><span>${c.score} / ${c.max}</span></div>${bar(c.max?c.score/c.max:0,c.score/c.max<.5)}<p class="muted small" style="margin-top:6px">${esc(c.comment)}</p></div>`).join('')}</div>
  <div class="stack"><div class="panel tint"><h2 class="h3" style="margin-bottom:10px">Feedback</h2><p>${esc(g.feedback)}</p></div>
   <div class="panel" id="rg">${d.submission.status==='regrade_requested'?`<h2 class="h3">Re-check requested</h2><p class="muted" style="margin-top:8px">Your teacher will look at this again.${d.submission.regrade_reason?' You wrote: '+esc(d.submission.regrade_reason):''}</p>`:d.submission.status==='teacher_confirmed'?'<h2 class="h3">Confirmed by your teacher</h2><p class="muted" style="margin-top:8px">This grade is final.</p>':`<h2 class="h3">Disagree with a score?</h2><p class="muted" style="margin:8px 0 14px">Tell your teacher what you think was missed.</p><textarea id="reason" style="min-height:90px" placeholder="For example: my working in Q1 was correct"></textarea><button class="btn soft" id="rgBtn" style="margin-top:12px">Ask for a re-check</button>`}</div></div></div>`}</div>`,
  mount(){
    if(poll)every(async()=>{try{const n=await api.submission(id);if(n.grade){timers.forEach(clearInterval);route()}}catch(_){}},1500);
    const b=$('#rgBtn');if(b)b.onclick=async()=>{const r=$('#reason').value.trim();if(!r){toast('Add a short reason first.');return}b.classList.add('load');b.disabled=true;
      try{await api.requestRegrade(id,r);toast('Re-check requested.');route()}catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}};
  }};
}
async function sProgress(){
  const p=await api.progress();const strong=[...p.cos].sort((a,b)=>b.mastery-a.mastery)[0],weak=[...p.cos].sort((a,b)=>a.mastery-b.mastery)[0];
  const W=640,H=250,px=i=>40+i*(W-80)/5,py=v=>H-30-v*(H-60);const cols=['var(--sky)','var(--blue)','var(--ink)'];
  const chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Mastery trend over six weeks">
   ${[0,.25,.5,.75,1].map(v=>`<line x1="40" x2="${W-40}" y1="${py(v)}" y2="${py(v)}" stroke="var(--powder)" stroke-width="2"/><text x="6" y="${py(v)+4}" font-size="11" fill="var(--ink2)">${pct(v)}</text>`).join('')}
   ${[0,1,2,3,4,5].map(i=>`<text x="${px(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--ink2)">W${i+1}</text>`).join('')}
   ${p.cos.map((c,k)=>`<polyline fill="none" stroke="${cols[k]}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="${c.trend.map((v,i)=>px(i)+','+py(v)).join(' ')}"/><circle cx="${px(5)}" cy="${py(c.trend[5])}" r="7" fill="${cols[k]}"/>`).join('')}</svg>
   <div class="row small" style="margin-top:8px">${p.cos.map((c,k)=>`<span class="row" style="gap:6px"><i style="width:14px;height:6px;border-radius:9px;background:${cols[k]}"></i><b>${c.co_id}</b></span>`).join('')}</div>`;
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>My progress</h1><p class="sub">Mastery is estimated per course outcome and updates after every graded assignment.</p></div>
  <div class="grid g3">${p.cos.map(c=>`<div class="panel stack"><div class="row between"><span class="chip co">${c.co_id}</span>${ring(c.mastery,120)}</div><h2 class="h3">${esc(c.title)}</h2><p class="muted small">Level range: <b>${c.bloom_level_range[0]}–${c.bloom_level_range[1]}</b><br>Ahead of ${pct(c.percentile)}% of the class</p></div>`).join('')}</div>
  <div class="sec split"><div class="panel"><h2 class="h2" data-reveal>Trend over six weeks</h2><div style="margin-top:20px">${chart}</div></div>
   <div class="stack"><div class="panel tint"><h2 class="h3">Strongest</h2><p style="margin-top:8px"><b>${strong.co_id}</b> · ${esc(strong.title)} · ${pct(strong.mastery)}%</p></div>
   <div class="panel deep"><h2 class="h3">Focus on next</h2><p style="margin-top:8px"><b>${weak.co_id}</b> · ${esc(weak.title)} · ${pct(weak.mastery)}%</p><p class="sub small" style="margin-top:10px">Revise the modules below, then your next assignment will adjust as your mastery rises.</p></div></div></div>
  <div class="sec panel"><h2 class="h2" data-reveal>Module-wise learning</h2><div class="grid g2" style="margin-top:22px;gap:18px 44px">${p.modules.map(m=>`<div><div class="row between small" style="margin-bottom:6px"><b>${esc(m.name)}</b><span class="muted">${pct(m.completed)}%</span></div>${bar(m.completed,m.completed<.5)}</div>`).join('')}</div></div></div>`};
}

  const d=await api.teacherDash();const c=s=>d.assignments.filter(a=>a.status===s).length;const cc=d.course||DB.course;
  const act=a=>a.status==='draft'?`<a class="btn sm" href="#/t/generate/${a.id}">Generate variants</a>`:a.status==='in_review'?`<a class="btn sm" href="#/t/review/${a.id}">Review and release</a>`:`<a class="btn sm soft" href="#/t/review/${a.id}">View variants</a>`;
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Good to see you, ${esc(DB.session.name.replace('Dr. ','Dr '))}.</h1><p class="sub">${esc(cc.code)} ${esc(cc.name)} · ${d.student_count??DB.students.length} students</p></div>
  <div class="panel tint"><div class="flow"><div><b data-count="${c('draft')}">0</b><span>Draft</span></div><div><b data-count="${c('generating')+c('in_review')}">0</b><span>In review</span></div><div><b data-count="${c('released')}">0</b><span>Released</span></div><div><b data-count="${c('closed')}">0</b><span>Closed</span></div></div></div>

   ${d.assignments.slice().reverse().map(a=>`<div class="item"><div class="grow"><b>${esc(a.title)}</b><span class="muted small">${a.total} marks · Due ${fmtDate(a.due)} · ${a.cos.join(', ')}</span></div>${pill(a.status)}${act(a)}</div>`).join('')}</div></div>
   <div class="panel deep"><h2 class="h3">Needs your review</h2><div style="margin-top:14px">${d.queue.length?d.queue.map(q=>`<a class="item" style="background:rgba(255,255,255,.08)" href="#/t/grading"><div class="grow"><b style="font-size:1rem">${esc(q.student_name)}</b><span class="small muted">${q.submission.status==='regrade_requested'?'Asked for a re-check':'AI confidence '+pct(q.grade.ai_confidence)+'%'}</span></div></a>`).join(''):'<p class="muted">Nothing waiting.</p>'}</div><a class="btn" style="background:var(--sky);color:#06203F;margin-top:18px" href="#/t/grading">Open grading queue</a></div></div></div>`};
}
async function tCreate(){
  const course=await api.course();
  const cosMap=course.cos,poMap=course.po_of||{};
  const syllabus=course.syllabus||SYLLABUS_TOPICS;
  const code=course.code||DB.course.code,cname=course.name||DB.course.name;
  const cosHtml=Object.entries(cosMap).map(([k,v],i)=>`<label class="cob"><input type="checkbox" value="${k}" ${i<2?'checked':''}><span><b>${k}</b> · ${esc(v)}<br><span class="muted small">Maps to ${(poMap[k]||[]).join(', ')}</span></span></label>`).join('');
  const chipsHtml=syllabus.map(t=>`<button type="button" class="chip" data-pick="${esc(t)}" style="cursor:pointer">+ ${esc(t)}</button>`).join('');
  return {
    html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Create an assignment.</h1><p class="sub">Select course outcomes and syllabus topics below, or type your own. Ergasia calibrates Bloom's level and question difficulty per student.</p></div>
    <div class="split"><form class="panel stack" id="cf" novalidate>
     <div><label class="f" for="ct">Title</label><input id="ct" type="text" value="Agents, Search and Games"></div>
     <div class="grid g2" style="gap:16px"><div><label class="f" for="cc">Course</label><select id="cc"><option value="${esc(code)}">${esc(code)} ${esc(cname)}</option></select></div><div><label class="f" for="cd">Due date</label><input id="cd" type="date" value="${addDays(TODAY,30)}" min="${TODAY}"></div></div>
     <div><label class="f">Course outcomes</label>${cosHtml}</div>
     <div><label class="f" for="tp">Selected topics (click a syllabus chip below, or type and press Enter)</label><input id="tp" type="text" placeholder="Type a custom topic and press Enter"><div class="tags" id="tags"></div>
     <div style="margin-top:12px"><span class="small muted" style="display:block;margin-bottom:6px">Quick-add from the ${esc(code)} syllabus:</span><div class="tags" id="syllabusChips">${chipsHtml}</div></div>
     <p class="small muted" style="margin-top:10px">Any selected course outcome with no topic gets its default syllabus topic added.</p></div>
     <div><label class="f" for="cm">Total marks</label><input id="cm" type="number" min="10" max="100" value="20"></div>
     <p class="small" id="cerr" style="color:var(--bad)" role="alert"></p>
     <button class="btn" id="cb" type="submit">Generate variants</button></form>
    <div class="panel tint stack"><h2 class="h3">The fairness rule</h2><div><b>Identical for everyone</b><p class="muted">Course outcomes, selected topics and total marks.</p></div><div><b>Varies per student</b><p class="muted">Difficulty, scenario and Bloom's taxonomy level (Remember to Create), based on each student's mastery.</p></div><p class="small muted">You will review the fairness report and every student's variant before releasing.</p></div></div></div>`,
    mount(){
      const topics=['PEAS & Intelligent Agents','Minimax & Alpha-Beta Pruning'];
      const tg=$('#tags');
      const draw=()=>{
        tg.innerHTML=topics.map((t,i)=>`<span class="tag">${esc(t)}<button type="button" data-i="${i}" aria-label="Remove ${esc(t)}">×</button></span>`).join('');
        $$('#syllabusChips [data-pick]').forEach(b=>{b.style.opacity=topics.includes(b.dataset.pick)?'0.4':'1'});
      };
      draw();
      tg.onclick=e=>{const i=e.target.dataset.i;if(i!=null){topics.splice(+i,1);draw()}};
      $$('#syllabusChips [data-pick]').forEach(b=>b.onclick=()=>{const v=b.dataset.pick;if(!topics.includes(v)){topics.push(v);draw()}});
      $('#tp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v&&!topics.includes(v)){topics.push(v);e.target.value='';draw()}}};
      $('#cf').onsubmit=async e=>{e.preventDefault();const err=$('#cerr');err.textContent='';
        const pending=$('#tp').value.trim();if(pending&&!topics.includes(pending)){topics.push(pending);$('#tp').value='';draw()}
        const cos=$$('.cob input:checked').map(i=>i.value),total=+$('#cm').value,title=$('#ct').value.trim(),due=$('#cd').value;
        if(!title)return err.textContent='Give the assignment a title.';
        if(!due)return err.textContent='Pick a due date.';
        if(!cos.length)return err.textContent='Choose at least one course outcome.';
        if(!topics.length)return err.textContent='Select or type at least one topic.';
        if(topics.length>8)return err.textContent='Choose at most 8 topics.';
        if(!(total>=10))return err.textContent='Total marks must be at least 10.';
        const b=$('#cb');b.classList.add('load');b.disabled=true;
        try{const a=await api.createAssignment({title,course:$('#cc').value,cos,topics:topics.slice(),total,due});location.hash='#/t/generate/'+a.id}
        catch(x){err.textContent=x.message;b.classList.remove('load');b.disabled=false}};
    }
  };
}
async function tGenerate(aid){
  const a=await api.assignment(aid);
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Generating variants.</h1><p class="sub">${esc(a.title)} · one version per student, ${a.student_count??DB.students.length} in total.</p></div>
  <div class="panel" style="max-width:640px"><div id="steps">${STEPS.map(s=>`<div class="step"><i></i>${s}</div>`).join('')}</div><div id="gerr" class="stack" hidden><p style="color:var(--bad)">Generation failed. Nothing was changed.</p><button class="btn" id="retry">Try again</button></div></div></div>`,
  mount(){
    const run=async()=>{$('#gerr').hidden=true;try{const {job_id}=await api.generate(aid);
      const t=every(async()=>{try{const j=await api.job(job_id);$$('.step').forEach((s,i)=>{s.classList.toggle('done',i<j.step);s.classList.toggle('on',i===j.step&&j.status!=='done')});
        if(j.status==='done'){clearInterval(t);toast('Variants ready for review.');location.hash='#/t/review/'+aid}}catch(_){clearInterval(t);$('#gerr').hidden=false}},700)}catch(_){$('#gerr').hidden=false}};
    $('#retry').onclick=run;run();
  }};
}
async function tReview(aid){
  let data=await api.variants(aid);let sel=data.variants[0].student_id,editing=null;
  const locked=()=>data.assignment.status!=='in_review';
  const fp=sid=>data.fairness.per_student.find(p=>p.student_id===sid);
  const okAll=()=>data.fairness.same_topics&&data.fairness.same_total_marks;
  const allApproved=()=>data.variants.every(v=>v.approved);
  return {html:`<div class="wrap"><div class="head"><a class="muted small" href="#/t/dashboard">Back to dashboard</a><h1 class="h1" data-reveal style="margin-top:12px">${esc(data.assignment.title)}</h1><div class="row"><span id="pillSlot"></span><span class="muted">${data.assignment.total} marks · Due ${fmtDate(data.assignment.due)}</span></div></div>
   <div id="fair"></div>
   <div class="rv-grid" style="margin-top:22px"><aside class="panel side" id="left" style="padding:16px"></aside><section id="right"></section></div></div>`,
  mount(){
    const sync=r=>{if(r.fairness)data.fairness=r.fairness;if(r.variant){const i=data.variants.findIndex(v=>v.variant_id===r.variant.variant_id);data.variants[i]={...data.variants[i],...r.variant}}};
    const drawFair=()=>{const f=data.fairness,bad=f.per_student.filter(p=>!p.topics_ok||!p.marks_ok);
      $('#pillSlot').innerHTML=pill(data.assignment.status);
      $('#fair').innerHTML=`<div class="panel ${okAll()?'tint':''}" style="${okAll()?'':'background:var(--warnbg)'}"><div class="row between"><div><h2 class="h3">Fairness report</h2><p class="muted small" style="margin-top:4px">${okAll()?`All ${f.per_student.length} variants cover the same topics and add up to ${f.expected_total} marks.`:`${bad.length} variant${bad.length>1?'s do':' does'} not match. Fix ${bad.length>1?'them':'it'} before release.`}</p></div>
       <div class="row"><span class="pill ${f.same_topics?'s-released':'s-regrade_requested'}">Same topics</span><span class="pill ${f.same_total_marks?'s-released':'s-regrade_requested'}">Same total marks</span></div></div>
       ${bad.map(p=>`<p class="small" style="margin-top:10px"><b>${esc(data.variants.find(v=>v.student_id===p.student_id)?.student_name||p.student_id)}</b>: ${!p.marks_ok?`marks add up to ${p.total}, expected ${f.expected_total}. `:''}${!p.topics_ok?'topics differ from the setup.':''}</p>`).join('')}</div>`};
    const drawLeft=()=>{$('#left').innerHTML=data.variants.map(v=>{const p=fp(v.student_id),bad=!p.topics_ok||!p.marks_ok;return `<button class="sel ${v.student_id===sel?'on':''}" data-s="${v.student_id}"><span class="dot ${bad?'bad':v.approved?'ok':''}"></span><span style="flex:1"><b>${esc(v.student_name)}</b><br><span class="small" style="opacity:.7">${bad?'Fairness issue':v.approved?'Approved':'Needs review'}</span></span></button>`}).join('')+
       (locked()?'':`<div style="padding:12px 6px 4px"><button class="btn sm soft" id="appAll" style="width:100%">Approve all fair variants</button></div>`)};
    const drawRight=()=>{const v=data.variants.find(x=>x.student_id===sel);
      const act=locked()?'':`<div class="row"><button class="btn sm ghost" id="regen">Regenerate</button><button class="btn sm" id="approve" ${v.approved?'disabled':''}>${v.approved?'Approved':'Approve variant'}</button></div>`;
      $('#right').innerHTML=`<div class="panel tint row between" style="margin-bottom:18px"><div><h2 class="h2">${esc(v.student_name)}</h2><p class="muted small">Mastery · ${Object.entries(v.mastery).map(([k,m])=>`${k} ${pct(m)}%`).join(' · ')}</p></div>${act}</div>
       ${v.questions.map((q,i)=>`<section class="q"><div class="row between"><div class="row">${chips(q)}</div>${locked()||editing===q.question_id?'':`<button class="btn sm soft" data-e="${q.question_id}">Edit</button>`}</div>
        ${editing===q.question_id?`<textarea id="et" style="margin:16px 0 10px">${esc(q.text)}</textarea><div class="row"><label class="small" for="em2"><b>Marks</b></label><input id="em2" type="number" min="1" value="${q.marks}" style="width:90px"><button class="btn sm" id="es">Save</button><button class="btn sm ghost" id="ec">Cancel</button></div>`:`<p class="qt">${i+1}. ${esc(q.text)}</p>`}
        <p class="muted small">Rubric: ${q.rubric.map(r=>`${esc(r.criterion)} (${r.max_marks})`).join(' · ')}</p></section>`).join('')}
       ${locked()?'':`<div class="sticky-bar"><span id="relMsg"></span><button class="btn" id="release">Release to students</button></div>`}`;
      if(!locked())refreshRel()};
    const refreshRel=()=>{const m=$('#relMsg'),b=$('#release');if(!m)return;const why=!okAll()?'Fix the fairness issues first.':!allApproved()?`${data.variants.filter(v=>!v.approved).length} variants still need approval.`:'Everything is approved and fair.';m.textContent=why;b.disabled=!(okAll()&&allApproved())};
    const all=()=>{drawFair();drawLeft();drawRight();bindAll()};
    const bindAll=()=>{
      /* the left list is re-rendered on every selection, so its handlers must be re-bound each time */
      $$('#left [data-s]').forEach(b=>b.onclick=()=>{sel=b.dataset.s;editing=null;drawLeft();drawRight();bindAll()});
      const aa=$('#appAll');if(aa)aa.onclick=async()=>{aa.classList.add('load');for(const v of data.variants){const p=fp(v.student_id);if(p.topics_ok&&p.marks_ok&&!v.approved)sync(await api.patchVariant(v.variant_id,{approved:true}))}all();toast('Fair variants approved.')};
      bindRight()};
    const bindRight=()=>{const v=data.variants.find(x=>x.student_id===sel);
      $$('[data-e]').forEach(b=>b.onclick=()=>{editing=b.dataset.e;drawRight();bindRight()});
      const g=id=>document.getElementById(id);
      if(g('ec'))g('ec').onclick=()=>{editing=null;drawRight();bindRight()};
      if(g('es'))g('es').onclick=async()=>{const b=g('es');b.classList.add('load');b.disabled=true;const marks=Math.max(1,+g('em2').value||1);try{sync(await api.patchVariant(v.variant_id,{question_id:editing,text:g('et').value.trim(),marks}));editing=null;toast('Question saved. Approve the variant again.');all()}catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}};
      if(g('approve'))g('approve').onclick=async()=>{const p=fp(v.student_id);if(!p.topics_ok||!p.marks_ok)return toast('This variant fails the fairness check.');sync(await api.patchVariant(v.variant_id,{approved:true}));all()};
      if(g('regen'))g('regen').onclick=async()=>{const b=g('regen');b.classList.add('load');b.disabled=true;try{sync(await api.regenerate(v.variant_id));toast('New variant generated.');all()}catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}};
      if(g('release'))g('release').onclick=async()=>{const b=g('release');b.classList.add('load');b.disabled=true;try{await api.release(aid);toast('Released to all students.');location.hash='#/t/dashboard'}catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}};
    };
    all();
  }};
}
async function tGrading(){
  let q=await api.gradingQueue();let cur=0,filter='all';
  const list=()=>q.filter(x=>filter==='all'||(filter==='low'&&x.grade.ai_confidence<.6)||(filter==='re'&&x.submission.status==='regrade_requested'));
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Grading review.</h1><p class="sub">Low-confidence grades and re-check requests come first. Nothing is final until you confirm it.</p></div>
   <div class="rv-grid"><aside class="panel side" style="padding:16px"><div class="row" id="flt" style="gap:6px;padding:4px 4px 12px"><button class="chip b2" data-f="all">All</button><button class="chip" data-f="low">Low confidence</button><button class="chip" data-f="re">Re-checks</button></div><div id="ql"></div></aside><section id="gd"></section></div></div>`,
  mount(){
    const drawList=()=>{const L=list();$$('#flt [data-f]').forEach(b=>b.className='chip '+(b.dataset.f===filter?'b2':''));if(cur>=L.length)cur=0;
      $('#ql').innerHTML=L.length?L.map((x,i)=>`<button class="sel ${i===cur?'on':''}" data-i="${i}"><span class="dot ${x.submission.status==='regrade_requested'?'bad':x.grade.ai_confidence<.6?'':'ok'}"></span><span style="flex:1"><b>${esc(x.student_name)}</b><br><span class="small" style="opacity:.7">${x.submission.status==='regrade_requested'?'Re-check requested':'AI confidence '+pct(x.grade.ai_confidence)+'%'}</span></span></button>`).join(''):'<p class="muted" style="padding:14px">Nothing in this view.</p>';
      $$('#ql [data-i]').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;drawList();drawDetail()})};
    const drawDetail=()=>{const x=list()[cur];const gd=$('#gd');if(!x){gd.innerHTML='<div class="panel tint err"><h2 class="h2">All caught up.</h2><p class="sub" style="margin:10px auto 0">Every submission in this view is confirmed.</p></div>';return}
      const g=x.grade;gd.innerHTML=`<div class="panel"><div class="row between"><div><h2 class="h2">${esc(x.student_name)}</h2><p class="muted">${esc(x.assignment_title)}</p></div><div style="min-width:180px"><div class="row between small"><b>AI confidence</b><span>${pct(g.ai_confidence)}%</span></div>${bar(g.ai_confidence,g.ai_confidence<.6)}</div></div>
      ${x.submission.regrade_reason?`<div class="panel" style="background:var(--warnbg);box-shadow:none;margin-top:18px;padding:18px 22px"><b>Student asked for a re-check</b><p class="small" style="margin-top:4px">${esc(x.submission.regrade_reason)}</p></div>`:''}
      <h3 class="h3" style="margin:28px 0 4px">Answers</h3>${x.answers.map((a,i)=>`<div class="answer"><div class="row small" style="margin-bottom:6px">${chips(x.questions[i])}</div>${esc(a.text)}</div>`).join('')}
      <div class="row between" style="margin:30px 0 6px"><h3 class="h3">Rubric scores</h3><b id="tot" style="font:800 1.8rem var(--display)"></b></div>
      ${g.per_criterion.map((c,i)=>`<div class="crit"><div><b>${esc(c.criterion)}</b></div><input type="number" step="0.5" min="0" max="${c.max}" value="${c.score}" data-c="${i}" aria-label="Score for ${esc(c.criterion)}"><div class="cm">AI note: ${esc(c.comment)} · out of ${c.max}</div></div>`).join('')}
      <label class="f" for="fb" style="margin-top:22px">Feedback to the student</label><textarea id="fb">${esc(g.feedback)}</textarea>
      <div class="row" style="margin-top:20px"><button class="btn" id="conf">Confirm grade</button><span class="muted small">Changing a score marks this grade as overridden.</span></div></div>`;
      const inputs=$$('[data-c]',gd);const upd=()=>{const t=inputs.reduce((s,i)=>s+(+i.value||0),0);$('#tot').textContent=`${t} / ${g.max_score}`};inputs.forEach(i=>i.oninput=upd);upd();
      $('#conf').onclick=async()=>{const b=$('#conf');const scores=inputs.map((i,k)=>clamp(+i.value||0,0,g.per_criterion[k].max));b.classList.add('load');b.disabled=true;
        try{await api.patchGrade(x.submission.id,{scores,feedback:$('#fb').value,confirm:true});toast('Grade confirmed.');q=await api.gradingQueue();drawList();drawDetail()}catch(e){toast(e.message);b.classList.remove('load');b.disabled=false}}};
    $$('#flt [data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;cur=0;drawList();drawDetail()});
    drawList();drawDetail();
  }};
}
async function tAnalytics(){
  const [m,cp]=await Promise.all([api.analyticsMastery(),api.analyticsCoPo()]);const get=(s,c)=>m.rows.find(r=>r.student_id===s&&r.co_id===c);let sel=m.students[0].id;
  const cos=Object.keys(m.cos);const avg=c=>m.students.reduce((t,s)=>t+get(s.id,c).mastery,0)/m.students.length;
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Class analytics.</h1><p class="sub">Mastery by course outcome, and attainment against the ${pct(cp.target)}% target.</p></div>
  <div class="split"><div class="panel"><div class="row between"><h2 class="h2" data-reveal>Mastery heatmap</h2><div class="row small muted" style="gap:8px">Low<span class="legend"></span>High</div></div>
   <div class="scroll-x" style="margin-top:20px"><div class="heat" style="grid-template-columns:150px repeat(${cos.length},1fr)"><span></span>${cos.map(c=>`<span class="hh" title="${esc(m.cos[c])}">${c}</span>`).join('')}
   ${m.students.map(s=>`<button class="hn ${s.id===sel?'on':''}" data-s="${s.id}">${esc(s.name)}</button>${cos.map(c=>{const v=get(s.id,c).mastery;return `<div class="hc" style="background:${heat(v)};color:${v>.52?'#fff':'var(--ink)'}">${pct(v)}</div>`}).join('')}`).join('')}
   <b class="hn">Class average</b>${cos.map(c=>`<div class="hc" style="box-shadow:inset 0 0 0 2px var(--ink)">${pct(avg(c))}</div>`).join('')}</div></div></div>
  <div class="panel tint stack" id="drill"></div></div>
  <div class="sec panel"><div class="row between"><div><h2 class="h2" data-reveal>CO–PO attainment</h2><p class="muted small" style="margin-top:6px">Share of students at or above ${pct(cp.target)}% mastery. Level 3 needs 70%, level 2 needs 60%, level 1 needs 50%.</p></div><button class="btn sm soft" id="csv">Copy as CSV</button></div>
   <div class="scroll-x"><table class="tbl" style="margin-top:14px"><thead><tr><th>Outcome</th><th>Mapped POs</th><th>At target</th><th>Level</th><th>Target</th></tr></thead><tbody>
   ${cp.rows.map(r=>`<tr><td><b>${r.co_id}</b><br><span class="muted small">${esc(r.title)}</span></td><td>${r.po_ids.join(', ')}</td><td style="min-width:160px">${pct(r.pct_at_target)}%${bar(r.pct_at_target)}</td><td><b style="font:800 1.5rem var(--display)">${r.attainment_level}</b></td><td>${r.target_met?'<span class="pill s-released">Met</span>':'<span class="pill s-regrade_requested">Not met</span>'}</td></tr>`).join('')}</tbody></table></div></div></div>`,
  mount(){
    const drill=()=>{const s=m.students.find(x=>x.id===sel);$('#drill').innerHTML=`<h2 class="h3">${esc(s.name)}</h2>${cos.map(c=>{const r=get(s.id,c);return `<div><div class="row between small" style="margin-bottom:6px"><b>${c}</b><span>${pct(r.mastery)}%</span></div>${bar(r.mastery,r.mastery<.5)}<p class="small muted" style="margin-top:4px">${r.bloom_level_range[0]}–${r.bloom_level_range[1]} · ahead of ${pct(r.percentile)}% of class</p></div>`}).join('')}`;
      $$('.hn[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===sel));
      $$('#drill [data-w]').forEach(e=>{e.style.width='0';requestAnimationFrame(()=>setTimeout(()=>e.style.width=e.dataset.w+'%',30))})};
    $$('.hn[data-s]').forEach(b=>b.onclick=()=>{sel=b.dataset.s;drill()});drill();
    $('#csv').onclick=async()=>{const t='CO,POs,Pct at target,Level,Target met\n'+cp.rows.map(r=>[r.co_id,r.po_ids.join('/'),pct(r.pct_at_target),r.attainment_level,r.target_met?'Yes':'No'].join(',')).join('\n');
      try{await navigator.clipboard.writeText(t);toast('CSV copied.')}catch(_){toast('Copying is blocked here. Try again in the full page.')}};
  }};
}
async function tKB(){
  const list=await api.kbList();
  return {html:`<div class="wrap"><div class="head"><h1 class="h1" data-reveal>Knowledge base.</h1><p class="sub">Upload the syllabus, textbook chapters and question banks. Ergasia reads them to write grounded questions.</p></div>
  <div class="split"><div class="panel"><h2 class="h2">Course materials</h2><div id="kl" style="margin-top:18px"></div></div>
  <label class="panel tint stack" id="dz" style="cursor:pointer;text-align:center;padding:48px 30px"><input type="file" id="kf" multiple class="sr"><h2 class="h3">Add materials</h2><p class="muted">Choose files, or drop them here. PDF, DOCX and TXT work best.</p><span class="btn" style="align-self:center">Choose files</span></label></div></div>`,
  mount(){
    let items=list;const draw=()=>{$('#kl').innerHTML=items.map(k=>`<div class="item"><div class="grow"><b style="font-size:1rem">${esc(k.name)}</b><span class="muted small">${esc(k.kind)} · ${esc(k.size)}</span></div>${k.status==='indexed'?'<span class="pill s-released">Indexed</span>':k.status==='failed'?'<span class="pill s-regrade_requested">Failed</span>':'<span class="pill s-submitted">Indexing</span>'}</div>`).join('')};draw();
    every(async()=>{if(items.some(k=>k.status==='indexing')){items=await api.kbList();draw()}},900);
    const up=async files=>{if(!files||!files.length)return;for(const f of files)await api.kbUpload(f);items=await api.kbList();draw();toast('Upload received. Indexing has started.')};
    $('#kf').onchange=async e=>{await up(e.target.files);e.target.value=''};
    const dz=$('#dz');
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('dz-on')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('dz-on')}));
    dz.addEventListener('drop',e=>up(e.dataTransfer.files));
  }};
}

/* ============================ ROUTER ============================ */
const routes=[
 [/^\/$/,null,landing],
 [/^\/s\/dashboard$/,'student',sDash],[/^\/s\/assignment\/([\w-]+)$/,'student',sAssign],[/^\/s\/grades$/,'student',sGrades],[/^\/s\/grades\/([\w-]+)$/,'student',sGrade],[/^\/s\/progress$/,'student',sProgress],
 [/^\/t\/dashboard$/,'teacher',tDash],[/^\/t\/create$/,'teacher',tCreate],[/^\/t\/generate\/(\w+)$/,'teacher',tGenerate],[/^\/t\/review\/(\w+)$/,'teacher',tReview],[/^\/t\/grading$/,'teacher',tGrading],[/^\/t\/analytics$/,'teacher',tAnalytics],[/^\/t\/kb$/,'teacher',tKB]
];
const NAV={student:[['Dashboard','#/s/dashboard','/s/dashboard'],['Grades','#/s/grades','/s/grades'],['Progress','#/s/progress','/s/progress']],
 teacher:[['Dashboard','#/t/dashboard','/t/dashboard'],['Create','#/t/create','/t/create'],['Grading','#/t/grading','/t/grading'],['Analytics','#/t/analytics','/t/analytics'],['Knowledge base','#/t/kb','/t/kb']]};
function header(){const u=sess();const path=(location.hash.slice(1)||'/');
  $('#topbar').innerHTML=`<div class="topbar-in"><a class="logo" href="#/"><i></i><span>Ergasia</span></a>${u?`<nav class="nav" aria-label="Main">${NAV[u.role].map(([l,h,p])=>`<a href="${h}" class="${path===p||(p!=='/s/dashboard'&&p!=='/t/dashboard'&&path.startsWith(p))?'on':''}">${l}</a>`).join('')}</nav><div class="who"><span class="av" title="${esc(u.name)}">${esc(initials(u.name))}</span><button class="out" id="so">Sign out</button></div>`:''}</div>`;
  const so=$('#so');if(so)so.onclick=()=>{DB.session=null;api.logout&&api.logout();try{localStorage.removeItem('ergasia.role')}catch(_){}header();location.hash='#/'};}
let token=0;
async function route(){
  const my=++token;timers.forEach(clearInterval);timers=[];
  const path=location.hash.slice(1)||'/';const hit=routes.map(([re,role,fn])=>({m:path.match(re),role,fn})).find(x=>x.m);
  header();const main=$('#main');scrollTo({top:0,behavior:'instant'});
  if(!hit){location.hash='#/';return}
  if(hit.role&&(!sess()||sess().role!==hit.role)){location.hash=sess()?`#/${sess().role[0]}/dashboard`:'#/';return}
  main.innerHTML=hit.fn===landing?'':skeleton();
  try{const page=await hit.fn(...hit.m.slice(1));if(my!==token)return;
    main.innerHTML=`<div class="page">${page.html}</div>`;
    mountMotion(main);page.mount&&page.mount();
  }catch(e){if(my!==token)return;console.error(e);main.innerHTML=`<div class="wrap"><div class="panel tint err stack"><h1 class="h1">That did not load.</h1><p class="sub" style="margin:0 auto">${esc(e.message||'Something went wrong.')}</p><div><button class="btn" id="rt">Try again</button></div></div></div>`;$('#rt').onclick=route}
}
addEventListener('hashchange',route);
(async()=>{
  /* Load the real backend script only when one is configured, so the mock never triggers a 404. */
  const src=(document.querySelector('meta[name="ergasia-backend"]')?.content||'').trim();
  if(src)await new Promise(res=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=res;document.head.appendChild(s)});
  if(window.ERGASIA_API){api=window.ERGASIA_API;try{DB.session=await api.me()}catch(_){DB.session=null}}
  else{try{const r=localStorage.getItem('ergasia.role');if(r&&DB.users[r])DB.session=DB.users[r]}catch(_){}}
  route();
})();
</script>
